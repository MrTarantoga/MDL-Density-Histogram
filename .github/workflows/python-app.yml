# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "!main", "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  build_wheels_with_test:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_TEST_REQUIRES: pytest pytest-xdist pandas pyarrow brotli meson cmake ninja
          CIBW_TEST_COMMAND: "pytest {project}/tests -n auto"
          CIBW_SKIP: >-
            cp39-* cp310-* *win32*

  build_wheels_without_test:
      name: Build wheels on ${{ matrix.os }}
      runs-on: ${{ matrix.os }}
      strategy:
        matrix:
          os: [windows-11-arm, macos-latest]
      steps:
        - uses: actions/checkout@v7
          with:
            lfs: true
        - name: Build wheels
          uses: pypa/cibuildwheel@v4.2.0
          env:
            CIBW_SKIP: >-
              cp39-* cp310-* *win32*